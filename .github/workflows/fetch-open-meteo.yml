name: Fetch Open-Meteo Weather Data

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional YYYY-MM-DD start date
        required: false
      end_date:
        description: Optional YYYY-MM-DD end date, inclusive
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch weather data
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
            python scripts/fetch_open_meteo.py --start-date "${{ github.event.inputs.start_date }}" --end-date "${{ github.event.inputs.end_date }}"
          else
            python scripts/fetch_open_meteo.py --rolling-days 14 --forecast-days 3
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Open-Meteo weather data"
            git push origin data
          fi
