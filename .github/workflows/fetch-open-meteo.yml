name: Fetch Open-Meteo Weather Data

on:
  schedule:
    # 16:30 local across summer/winter, with later retries for delayed GitHub jobs.
    - cron: "30 14 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional YYYY-MM-DD recovery start date
        required: false
      end_date:
        description: Optional YYYY-MM-DD recovery end date (inclusive)
        required: false
      phase:
        description: Collect current forecasts, recover history, or both
        type: choice
        options: [all, forecast, history]
        default: all

permissions:
  contents: write

concurrency:
  group: open-meteo-data-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Brussels schedule guard
        id: clock
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Brussels date +%H%M)" -ge 1630 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Before the 16:30 Brussels collection window; no collection attempted." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Code always comes from the workflow revision, never the historical data branch.
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'

      - name: Checkout saved archive separately
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: archive
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            data/raw
            data/update_manifest.csv
            data/status.json

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.clock.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Check saved data freshness and coverage
        if: steps.clock.outputs.run == 'true'
        id: fresh
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "complete=$(python -m scripts.check_freshness --data-dir archive/data)" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect current forecasts and resume missing history
        if: steps.clock.outputs.run == 'true' && steps.fresh.outputs.complete != 'true'
        id: collect
        continue-on-error: true
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          PHASE: ${{ inputs.phase || 'all' }}
        run: |
          ARGS=(--data-dir archive/data --phase "$PHASE" --rolling-days 100 --forecast-days 3 --chunk-days 3)
          if [ -n "$START_DATE" ] || [ -n "$END_DATE" ]; then
            test -n "$START_DATE" && test -n "$END_DATE"
            ARGS+=(--start-date "$START_DATE" --end-date "$END_DATE")
          fi
          python -u scripts/fetch_open_meteo.py "${ARGS[@]}"

      - name: Publish successful series even if another request failed
        if: always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != ''
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse data
          if ! git diff --cached --quiet; then
            git commit -m "Update weather archive and collection status"
            git push origin HEAD:data
          fi

      - name: Report collection status
        if: always() && steps.clock.outputs.run == 'true'
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          ALREADY_FRESH: ${{ steps.fresh.outputs.complete }}
        run: |
          if [ "$ALREADY_FRESH" = "true" ]; then
            echo "Archive already refreshed after 16:30 Brussels; full context and forecast coverage verified." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$COLLECTION_OUTCOME" = "success" ]; then
            echo "Weather collection completed and coverage verified. See data/status.json on the data branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Weather archive remains incomplete. Successful series were preserved; inspect data/status.json and retry." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
